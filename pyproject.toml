[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer service agent for Empório da Música, a fictional musical instrument store (Artefact AI Engineer challenge)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[anthropic]>=2.64.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
